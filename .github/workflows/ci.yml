name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Construir las imágenes de Docker
        run: docker compose build

  test:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend-taller-ops1/pnpm-lock.yaml

      - name: Instalar dependencias del backend
        working-directory: backend-taller-ops1
        run: pnpm install --frozen-lockfile

      - name: Tests unitarios del backend (Jest)
        working-directory: backend-taller-ops1
        run: pnpm test

      - name: Levantar el stack completo con Docker Compose
        run: docker compose up -d --build

      - name: Dar permisos de ejecución al script de pruebas
        run: chmod +x scripts/test_endpoints.sh

      - name: Verificar los endpoints
        run: ./scripts/test_endpoints.sh

      - name: Apagar el stack
        if: always()
        run: docker compose down

  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Construir las imágenes de Docker
        working-directory: ./backend-taller-ops1
        run: docker compose build

      - name: Levantar el stack completo con Docker Compose
        working-directory: ./backend-taller-ops1
        run: docker compose up -d --build 