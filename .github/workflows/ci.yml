name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Construir las imágenes de Docker
        run: docker compose build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend-taller-ops1/pnpm-lock.yaml

      - name: Instalar dependencias del backend
        working-directory: backend-taller-ops1
        run: pnpm install --frozen-lockfile

      - name: Tests unitarios del backend (Jest)
        working-directory: backend-taller-ops1
        run: pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - mame: Login en DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extraer metadata docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/your-repo-name
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build y push a docker hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dar permisos de ejecución al script de pruebas
        run: chmod +x scripts/test_endpoints.sh

      - name: Verificar los endpoints
        run: ./scripts/test_endpoints.sh

      - name: Apagar el stack
        if: always()
        run: docker compose down

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Construir las imágenes de Docker
        working-directory: ./backend-taller-ops1
        run: docker compose build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - mame: Login en DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extraer metadata docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/your-repo-name
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build y push a docker hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max